<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="600" fill="#0d0d12"/>

  <defs>
    <clipPath id="inside">
      <path d="M 165 285 C 251 285, 266 155, 435 155 L 435 445 L 165 445 Z"/>
    </clipPath>
  </defs>

  <g fill="#F2543D">
    <!-- 3 bars at 18 wide, matching the frame weight, centers 67.5 apart -->
    <g clip-path="url(#inside)">
      <rect x="223.5" y="145" width="18" height="310"/>
      <rect x="291" y="145" width="18" height="310"/>
      <rect x="358.5" y="145" width="18" height="310"/>
    </g>

    <!-- Frame: S rail starts low on the left, sweeps up to the right -->
    <path d="M 165 285 C 251 285, 266 155, 435 155 L 435 445 L 165 445 Z"
          fill="none" stroke="#F2543D" stroke-width="18" stroke-linejoin="round"/>
  </g>
</svg>
